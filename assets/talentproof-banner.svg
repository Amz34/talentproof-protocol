<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#040D1A" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bg)" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Subtle Grid Accent -->
  <path d="M 0 85 L 1200 85 M 0 170 L 1200 170 M 0 255 L 1200 255" stroke="#1E293B" stroke-dasharray="4 4" opacity="0.4"/>
  <path d="M 300 0 L 300 340 M 600 0 L 600 340 M 900 0 L 900 340" stroke="#1E293B" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Badge Top -->
  <rect x="60" y="45" width="220" height="32" rx="16" fill="#064E3B" stroke="#059669" stroke-width="1.2"/>
  <text x="170" y="66" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">SOVEREIGN PROTOCOL</text>

  <!-- Title -->
  <text x="60" y="130" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">TalentProof Protocol</text>
  
  <!-- Subtitle Accent Line -->
  <rect x="60" y="150" width="480" height="4" rx="2" fill="url(#accent)"/>

  <!-- Tagline -->
  <text x="60" y="195" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
    Bilateral Developer Proof Attestation, Anti-AI-Spam Gatekeeper &amp; Milestone Escrow Kernel
  </text>
  <text x="60" y="225" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
    Replacing 20% recruiter margins with deterministic code verification, fair USD rates, and zero-leak contracts.
  </text>

  <!-- Metric Badges Bottom -->
  <g transform="translate(60, 260)">
    <!-- Pill 1 -->
    <rect width="180" height="38" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="90" y="24" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle">⚡ Zero C-Deps</text>

    <!-- Pill 2 -->
    <rect x="200" width="210" height="38" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="305" y="24" fill="#34D399" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle">🛡️ SHA-256 Attested</text>

    <!-- Pill 3 -->
    <rect x="430" width="220" height="38" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="540" y="24" fill="#FBBF24" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle">💵 USD Escrow Rails</text>
  </g>
</svg>
